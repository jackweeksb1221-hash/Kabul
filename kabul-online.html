}

/* ---------------------------------------------------------------- */
/* Main component                                                    */
/* ---------------------------------------------------------------- */
function KabulGame() {
  const [screen, setScreen] = useState("home");
  const [name, setName] = useState("");
  const [joinCode, setJoinCode] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const [code, setCode] = useState("");
  const [mySlot, setMySlot] = useState(null);
  const [room, setRoom] = useState(null);
  const [mode, setMode] = useState("online"); // 'online' | 'bot'
  const pollRef = useRef(null);
  const botStackSeenRef = useRef(null);

  const [peekedIdx, setPeekedIdx] = useState([]);
  const [stackMode, setStackMode] = useState(false);
  const [effectFlow, setEffectFlow] = useState(null);
  const [modal, setModal] = useState(null);
  const [showRules, setShowRules] = useState(false);
  const [copied, setCopied] = useState(false);
  const [flashKeys, setFlashKeys] = useState(new Set());
  const [nowTick, setNowTick] = useState(Date.now());
  const [tapSelected, setTapSelected] = useState(null);
  const tapTimerRef = useRef(null);
  const [godMode, setGodMode] = useState(false);
  const [shuffling, setShuffling] = useState(false);
  const shuffledRoundRef = useRef(null);
  const writerIdRef = useRef(`w${Math.random().toString(36).slice(2, 10)}`);
  const flashTimerRef = useRef(null);
  const anchorsRef = useRef({});
  const [flights, setFlights] = useState([]);
  const flightSeqRef = useRef(0);

  const anchorFor = (key) => (el) => {
    if (el) anchorsRef.current[key] = el;
    else delete anchorsRef.current[key];
  };

  // positions as of the PREVIOUS commit, so we can still animate from a slot
  // that has already been emptied or unmounted by the state change
  const rectCacheRef = useRef({});

  function rectOf(key) {
    const el = anchorsRef.current[key];
    if (el) {
      const r = el.getBoundingClientRect();
      if (r.width && r.height) return { left: r.left, top: r.top, width: r.width, height: r.height };
    }
    return rectCacheRef.current[key] || null;
  }

  useEffect(() => {
    if (mode === "bot" || !code || !mySlot) return;
    let cancelled = false;
    async function tick() {
      const r = await readRoom(code);
      if (!cancelled && r) setRoom((prev) => (!prev || r.version > prev.version ? r : prev));
    }
    tick();
    pollRef.current = setInterval(tick, 220);
    return () => { cancelled = true; clearInterval(pollRef.current); };
  }, [code, mySlot, mode]);

  // a compact signature of the bits of room state that should wake the bot up
  const botSig = room
    ? [room.phase, room.turn, !!room.drawnCard, !!room.pendingEffect, !!room.pendingGive, room.discardPile.length, room.drawnBy, room.kabulCalledBy, room.players.find((p) => p.slot === BOT_SLOT)?.ready].join("|")
    : "";

  // animate cards flying between slots, then briefly highlight where they landed
  useEffect(() => {
    if (!room || !room.lastMove) return;
    const lm = room.lastMove;

    if (lm.flights && lm.flights.length) {
      // measure before React paints the new state over the old positions
      const launched = lm.flights
        .map((f) => {
          const from = rectOf(f.from);
          const to = rectOf(f.to);
          if (!from || !to) return null;
          // a card is shown face up if it is public, or if this viewer is the
          // one entitled to see it (their own draw)
          const faceUp = !!f.faceUp || (!!f.faceUpFor && f.faceUpFor === mySlot);
          return { id: `f${flightSeqRef.current++}`, card: f.card, faceUp, from, to };
        })
        .filter(Boolean);
      if (launched.length) setFlights((prev) => [...prev, ...launched]);
    }

    const delay = lm.flights && lm.flights.length ? FLIGHT_MS : 0;
    clearTimeout(flashTimerRef.current);
    const t = setTimeout(() => {
      setFlashKeys(new Set(lm.keys || []));
      flashTimerRef.current = setTimeout(() => setFlashKeys(new Set()), 1800);
    }, delay);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [room?.lastMove?.ts]);

  // refresh the position cache after each commit (must run after the flight
  // effect above, so that effect still sees the previous commit's positions)
  useEffect(() => {
    const next = {};
    Object.keys(anchorsRef.current).forEach((k) => {
      const r = anchorsRef.current[k].getBoundingClientRect();
      if (r.width && r.height) next[k] = { left: r.left, top: r.top, width: r.width, height: r.height };
    });
    rectCacheRef.current = next;
  });

  useEffect(() => {
    if (room && room.pendingEffect && room.pendingEffect.by === mySlot && !effectFlow) {
      const e = room.pendingEffect.effect;
      const stageMap = { "view-own": "pick", "view-opp": "pick", "blind-swap": "pick-own", "view1-swap": "pick-view", "view2-swap": "pick-view" };
      setEffectFlow({ type: e, stage: stageMap[e], viewed: [] });
    }
    if (room && !room.pendingEffect && effectFlow) setEffectFlow(null);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [room?.pendingEffect]);

  // if a give is owed but the giver has no cards left, clear it so play continues
  useEffect(() => {
    if (!room || !room.pendingGive || room.pendingGive.from !== mySlot) return;
    const mine = room.players.find((p) => p.slot === mySlot);
    if (mine && !mine.grid.some(Boolean)) {
      updateRoom((s) => (s.pendingGive && s.pendingGive.from === mySlot
        ? { ...s, pendingGive: null, log: [...s.log, `${nameOf(s, mySlot)} had no cards left to hand over.`] }
        : s));
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [room?.pendingGive]);

  // play the shuffle once per freshly dealt round
  useEffect(() => {
    if (!room || room.phase !== "peek") return;
    const key = `${room.code}-${room.round}`;
    if (shuffledRoundRef.current === key) return;
    shuffledRoundRef.current = key;
    setShuffling(true);
  }, [room?.phase, room?.round, room?.code]);

  // keep the Kabul window counting down on screen while it is open
  useEffect(() => {
    if (!room || !room.kabulWindow) return;
    setNowTick(Date.now());
    const id = setInterval(() => setNowTick(Date.now()), 150);
    return () => clearInterval(id);
  }, [room?.kabulWindow?.expires]);

  async function updateRoom(transform) {
    if (mode === "bot") {
      setRoom((prev) => {
        if (!prev) return prev;
        const draft = transform(JSON.parse(JSON.stringify(prev)));
        return draft || prev;
      });
      return;
    }
    const result = await casUpdate(code, writerIdRef.current, transform);
    if (result) setRoom((prev) => (!prev || (result.version || 0) >= (prev.version || 0) ? result : prev));
  }

  /* ---------------- lobby / connection ---------------- */
  async function handleCreate() {
    setBusy(true); setError("");
    // a code may already be taken on the matchmaking server; try a few
    for (let attempt = 0; attempt < 4; attempt++) {
      const newCode = generateCode();
      const state = newRoomState(newCode, name.trim() || "Player 1");
      try {
        const live = await hostRoom(newCode, state);
        setCode(newCode); setMySlot("p1"); setRoom(live); setScreen("game");
        setBusy(false);
        return;
      } catch (e) {
        if (e && e.type === "unavailable-id") continue;
        setError("Couldn't open a room. Check your connection and try again.");
        setBusy(false);
        return;
      }
    }
    setError("Couldn't open a room. Please try again.");
    setBusy(false);
  }

  async function handleJoin() {
    setBusy(true); setError("");
    const c = joinCode.trim().toUpperCase();
    if (!c) { setError("Enter a room code."); setBusy(false); return; }
    let r;
    try {
      r = await joinRoom(c);
    } catch (e) {
      setError("Couldn't reach that room. Check the code, and make sure your friend still has the game open.");
      setBusy(false);
      return;
    }
    const updated = {
      ...r,
      players: r.players.map((p, i) => (i === 1 ? { ...p, connected: true, name: name.trim() || "Player 2" } : p)),
      log: [...r.log, `${name.trim() || "Player 2"} joined the room.`],
    };
    setMySlot("p2");
    const saved = await writeRoom(updated, writerIdRef.current);
    setCode(c); setRoom(saved); setScreen("game");
    setBusy(false);
  }

  function copyCode() {
    try {
      navigator.clipboard.writeText(code);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (e) {}
  }

  function leaveRoom() {
    clearInterval(pollRef.current);
    clearTimeout(flashTimerRef.current);
    if (mode !== "bot") netTeardown();
    setScreen("home"); setRoom(null); setCode(""); setMySlot(null); setMode("online");
    clearTimeout(tapTimerRef.current);
    setShuffling(false); shuffledRoundRef.current = null; setGodMode(false);
    setPeekedIdx([]); setStackMode(false); setEffectFlow(null); setModal(null); setFlashKeys(new Set()); setFlights([]); setTapSelected(null); setGodMode(false);
    botStackSeenRef.current = null;
  }

  function handlePlayBot() {
    const base = newRoomState("BOT", name.trim() || "You");
    base.players[1] = { ...base.players[1], name: "Bot", connected: true };
    const dealt = dealRound({ ...base, round: 1 });
    setMode("bot"); setCode("BOT"); setMySlot("p1"); setRoom(dealt); setScreen("game");
  }

  /* ---------------- game actions ---------------- */
  async function handleStartRound() {
    await updateRoom((s) => (s.phase === "lobby" ? dealRound({ ...s, round: 1 }) : s));
  }

  async function handlePeekReady() {
    await updateRoom((s) => {
      const players = s.players.map((p) => (p.slot === mySlot ? { ...p, ready: true } : p));
      const bothReady = players.every((p) => p.ready);
      return {
        ...s, players, phase: bothReady ? "playing" : "peek",
        log: [...s.log, `${nameOf(s, mySlot)} is ready.`, ...(bothReady ? ["Both players ready — game begins!"] : [])],
      };
    });
    setPeekedIdx([]);
  }

  async function handleDrawFrom(pile) {
    await updateRoom((s) => {
      if (s.turn !== mySlot || s.drawnCard || s.pendingEffect || s.pendingGive) return s;
      let { drawPile, discardPile } = ensureDraw(s);
      let drawn;
      if (pile === "discard") {
        if (discardPile.length === 0) return s;
        drawn = discardPile[discardPile.length - 1];
        discardPile = discardPile.slice(0, -1);
      } else {
        if (drawPile.length === 0) return s;
        drawn = drawPile[drawPile.length - 1];
        drawPile = drawPile.slice(0, -1);
      }
      return {
        ...s, drawPile, discardPile, drawnCard: drawn, drawnBy: mySlot, kabulWindow: null,
        lastMove: {
          keys: [],
          flights: [{
            from: pile === "discard" ? "discard" : "deck",
            to: "drawn",
            card: drawn,
            // a discard-pile draw is public; a deck draw only the drawer sees
            faceUp: pile === "discard",
            faceUpFor: mySlot,
          }],
          ts: Date.now(),
        },
        log: [...s.log, `${nameOf(s, mySlot)} drew from the ${pile === "discard" ? "discard pile" : "deck"}.`],
      };
    });
  }

  async function handleDiscardDrawn() {
    await updateRoom((s) => {
      if (s.drawnBy !== mySlot || !s.drawnCard) return s;
      const card = s.drawnCard;
      const discardPile = [...s.discardPile, card];
      const nextTurn = mySlot === "p1" ? "p2" : "p1";
      let pendingEffect = null;
      let finalTurnTaken = s.finalTurnTaken;
      const isFinalTurn = s.phase === "kabul-final";
      if (isFinalTurn) finalTurnTaken = true;
      // once Kabul is called the caller's hand is locked — the final turn gets
      // no powers at all, so nothing can reach into their cards
      if (card.effect && !isFinalTurn) pendingEffect = { effect: card.effect, by: mySlot };
      let next = {
        ...s, discardPile, drawnCard: null, drawnBy: null, turn: nextTurn, pendingEffect, finalTurnTaken, firstDiscardDone: true,
        kabulWindow: pendingEffect ? null : openKabulWindow(s, mySlot),
        lastMove: { keys: [], flights: [{ from: "drawn", to: "discard", card, faceUp: true }], ts: Date.now() },
        log: [...s.log, `${nameOf(s, mySlot)} discarded the drawn ${card.rank}${SUIT_SYMBOL[card.suit]}${pendingEffect ? " — power available!" : isFinalTurn && card.effect ? " — no powers on the final turn." : "."}`],
      };
      if (!pendingEffect && isFinalTurn) next = finalizeRound(next);
      return next;
    });
  }

  async function handleSwapDrawn(cardId) {
    await updateRoom((s) => {
      if (s.drawnBy !== mySlot || !s.drawnCard) return s;
      const players = s.players.map((p) => ({ ...p, grid: [...p.grid] }));
      const mine = players.find((p) => p.slot === mySlot);
      const idx = mine.grid.findIndex((c) => c && c.id === cardId);
      if (idx === -1) return s;
      const old = mine.grid[idx];
      mine.grid[idx] = s.drawnCard;
      const discardPile = [...s.discardPile, old];
      const nextTurn = mySlot === "p1" ? "p2" : "p1";
      let finalTurnTaken = s.finalTurnTaken;
      if (s.phase === "kabul-final") finalTurnTaken = true;
      let next = {
        ...s, players, discardPile, drawnCard: null, drawnBy: null, turn: nextTurn, finalTurnTaken, firstDiscardDone: true,
        kabulWindow: openKabulWindow(s, mySlot),
        lastMove: {
          keys: [`${mySlot}-${idx}`],
          flights: [
            { from: "drawn", to: `${mySlot}-${idx}`, card: s.drawnCard, faceUp: false },
            { from: `${mySlot}-${idx}`, to: "discard", card: old, faceUp: true },
          ],
          ts: Date.now(),
        },
        log: [...s.log, `${nameOf(s, mySlot)} swapped in a card and discarded ${old.rank}${SUIT_SYMBOL[old.suit]}.`],
      };
      if (s.phase === "kabul-final") next = finalizeRound(next);
      return next;
    });
  }

  async function handleStackTap(targetSlot, cardId) {
    await updateRoom((s) => {
      // stacking is live at any time until Kabul locks the round; it does not
      // care whose turn it is, or whether a draw or power-up is in progress
      if (s.phase !== "playing" || s.pendingGive) return s;
      const top = s.discardPile[s.discardPile.length - 1];
      const players = s.players.map((p) => ({ ...p, grid: [...p.grid] }));
      const targetP = players.find((p) => p.slot === targetSlot);
      const idx = targetP.grid.findIndex((c) => c && c.id === cardId);
      if (idx === -1) return s;
      const card = targetP.grid[idx];
      // no stacking off the round's opening flip — the first play must be a
      // real turn, so an early stack attempt is an automatic penalty
      const tooEarly = !s.firstDiscardDone;
      const match = !tooEarly && card.rank === top.rank;
      if (match) {
        targetP.grid[idx] = null;
        const discardPile = [...s.discardPile, card];
        const pendingGive = targetSlot !== mySlot ? { from: mySlot, to: targetSlot } : null;
        return {
          ...s, players, discardPile, pendingGive,
          lastMove: { keys: [], flights: [{ from: `${targetSlot}-${idx}`, to: "discard", card, faceUp: true }], ts: Date.now() },
          log: [...s.log, `${nameOf(s, mySlot)} stacked a ${card.rank}${SUIT_SYMBOL[card.suit]}${targetSlot !== mySlot ? ` from ${nameOf(s, targetSlot)}'s cards` : ""}!`],
        };
      } else {
        const { drawPile, discardPile } = ensureDraw(s);
        const dp = [...drawPile];
        const stackerP = players.find((p) => p.slot === mySlot);
        const penalty = dp.pop();
        let landIdx = -1;
        if (penalty) {
          const empty = stackerP.grid.findIndex((c) => c === null);
          if (empty !== -1) { stackerP.grid[empty] = penalty; landIdx = empty; }
          else { stackerP.grid.push(penalty); landIdx = stackerP.grid.length - 1; }
        }
        return {
          ...s, players, drawPile: dp, discardPile,
          lastMove: {
            keys: landIdx !== -1 ? [`${mySlot}-${landIdx}`] : [],
            flights: landIdx !== -1 ? [{ from: "deck", to: `${mySlot}-${landIdx}`, card: penalty, faceUp: false }] : [],
            ts: Date.now(),
          },
          log: [...s.log, tooEarly
            ? `${nameOf(s, mySlot)} tried to stack before the round's first play — penalty card.`
            : `${nameOf(s, mySlot)} guessed wrong and picked up a penalty card.`],
        };
      }
    });
  }

  async function handleGiveCard(cardId) {
    await updateRoom((s) => {
      if (!s.pendingGive || s.pendingGive.from !== mySlot) return s;
      const players = s.players.map((p) => ({ ...p, grid: [...p.grid] }));
      const fromP = players.find((p) => p.slot === s.pendingGive.from);
      const toP = players.find((p) => p.slot === s.pendingGive.to);
      const idx = fromP.grid.findIndex((c) => c && c.id === cardId);
      if (idx === -1) return s;
      const card = fromP.grid[idx];
      fromP.grid[idx] = null;
      const empty = toP.grid.findIndex((c) => c === null);
      let landIdx;
      if (empty !== -1) { toP.grid[empty] = card; landIdx = empty; } else { toP.grid.push(card); landIdx = toP.grid.length - 1; }
      return {
        ...s, players, pendingGive: null,
        lastMove: {
          keys: [`${toP.slot}-${landIdx}`],
          flights: [{ from: `${fromP.slot}-${idx}`, to: `${toP.slot}-${landIdx}`, card, faceUp: false }],
          ts: Date.now(),
        },
        log: [...s.log, `${nameOf(s, fromP.slot)} handed a card to ${nameOf(s, toP.slot)}.`],
      };
    });
  }

  async function resolveViewEffect() {
    await updateRoom((s) => {
      if (!s.pendingEffect || s.pendingEffect.by !== mySlot) return s;
      let next = { ...s, pendingEffect: null, kabulWindow: openKabulWindow(s, mySlot), log: [...s.log, `${nameOf(s, mySlot)} used the card's power.`] };
      if (next.finalTurnTaken) next = finalizeRound(next);
      return next;
    });
  }

  async function resolveSwapEffect(ownCardId, oppCardId) {
    await updateRoom((s) => {
      if (!s.pendingEffect || s.pendingEffect.by !== mySlot) return s;
      const players = s.players.map((p) => ({ ...p, grid: [...p.grid] }));
      const mine = players.find((p) => p.slot === mySlot);
      const opp = players.find((p) => p.slot !== mySlot);
      const mi = mine.grid.findIndex((c) => c && c.id === ownCardId);
      const oi = opp.grid.findIndex((c) => c && c.id === oppCardId);
      if (mi === -1 || oi === -1) {
        let next = { ...s, pendingEffect: null, kabulWindow: openKabulWindow(s, mySlot), log: [...s.log, `${nameOf(s, mySlot)}'s power fizzled — one of those cards is gone now.`] };
        if (next.finalTurnTaken) next = finalizeRound(next);
        return next;
      }
      const tmp = mine.grid[mi];
      const oppCard = opp.grid[oi];
      mine.grid[mi] = oppCard;
      opp.grid[oi] = tmp;
      let next = {
        ...s, players, pendingEffect: null, kabulWindow: openKabulWindow(s, mySlot),
        lastMove: {
          keys: [`${mySlot}-${mi}`, `${opp.slot}-${oi}`],
          flights: [
            { from: `${mySlot}-${mi}`, to: `${opp.slot}-${oi}`, card: tmp, faceUp: false },
            { from: `${opp.slot}-${oi}`, to: `${mySlot}-${mi}`, card: oppCard, faceUp: false },
          ],
          ts: Date.now(),
        },
        log: [...s.log, `${nameOf(s, mySlot)} swapped a card with ${nameOf(s, opp.slot)}.`],
      };
      if (next.finalTurnTaken) next = finalizeRound(next);
      return next;
    });
  }

  async function handleCallKabul() {
    await updateRoom((s) => {
      if (s.kabulCalledBy || s.drawnCard || s.pendingEffect) return s;
      const inWindow = s.kabulWindow && s.kabulWindow.slot === mySlot && Date.now() < s.kabulWindow.expires;
      if (s.turn !== mySlot && !inWindow) return s;
      const other = mySlot === "p1" ? "p2" : "p1";
      return {
        ...s, kabulCalledBy: mySlot, phase: "kabul-final", turn: other, kabulWindow: null,
        log: [...s.log, `${nameOf(s, mySlot)} called KABUL! ${nameOf(s, other)} gets one final turn.`],
      };
    });
  }

  async function handleNextRound() {
    await updateRoom((s) => (s.round >= 5 ? { ...s, phase: "game-end" } : dealRound({ ...s, round: s.round + 1 })));
  }

  async function handleNewMatch() {
    await updateRoom((s) => dealRound({ ...s, round: 1, players: s.players.map((p) => ({ ...p, score: 0, roundScores: [] })) }));
  }

  /* ---------------- bot AI ---------------- */
  async function botReady() {
    await updateRoom((s) => {
      const players = s.players.map((p) => (p.slot === BOT_SLOT ? { ...p, ready: true } : p));
      const bothReady = players.every((p) => p.ready);
      return {
        ...s, players, phase: bothReady ? "playing" : "peek",
        log: [...s.log, bothReady ? "Both players ready — game begins!" : `${nameOf(s, BOT_SLOT)} is ready.`],
      };
    });
  }

  async function botCallKabul() {
    await updateRoom((s) => {
      if (s.turn !== BOT_SLOT || s.drawnCard || s.pendingEffect || s.kabulCalledBy) return s;
      return {
        ...s, kabulCalledBy: BOT_SLOT, phase: "kabul-final", turn: "p1", kabulWindow: null,
        log: [...s.log, `${nameOf(s, BOT_SLOT)} called KABUL! You get one final turn.`],
      };
    });
  }

  async function botDraw() {
    await updateRoom((s) => {
      if (s.turn !== BOT_SLOT || s.drawnCard || s.pendingEffect || s.pendingGive) return s;
      let { drawPile, discardPile } = ensureDraw(s);
      const top = discardPile[discardPile.length - 1];
      let fromDiscard = !!top && top.value <= 3;
      let drawn;
      if (fromDiscard) {
        drawn = discardPile[discardPile.length - 1];
        discardPile = discardPile.slice(0, -1);
      } else if (drawPile.length === 0) {
        fromDiscard = true;
        drawn = discardPile[discardPile.length - 1];
        discardPile = discardPile.slice(0, -1);
      } else {
        drawn = drawPile[drawPile.length - 1];
        drawPile = drawPile.slice(0, -1);
      }
      return {
        ...s, drawPile, discardPile, drawnCard: drawn, drawnBy: BOT_SLOT,
        lastMove: {
          keys: [],
          flights: [{
            from: fromDiscard ? "discard" : "deck",
            to: "drawn",
            card: drawn,
            faceUp: fromDiscard,
            faceUpFor: BOT_SLOT,
          }],
          ts: Date.now(),
        },
        log: [...s.log, `${nameOf(s, BOT_SLOT)} drew from the ${fromDiscard ? "discard pile" : "deck"}.`],
      };
    });
  }

  async function botDecideDrawn() {
    await updateRoom((s) => {
      if (s.drawnBy !== BOT_SLOT || !s.drawnCard) return s;
      const drawn = s.drawnCard;
      const known = s.botKnown || {};
      const players = s.players.map((p) => ({ ...p, grid: [...p.grid] }));
      const bot = players.find((p) => p.slot === BOT_SLOT);
      let worstIdx = -1, worstVal = -Infinity;
      bot.grid.forEach((c, i) => { if (c && known[c.id] && c.value > worstVal) { worstVal = c.value; worstIdx = i; } });
      let swapIdx = -1;
      if (worstIdx !== -1 && drawn.value < worstVal) swapIdx = worstIdx;
      else if (worstIdx === -1) {
        const unknownIdxs = bot.grid.map((c, i) => (c && !known[c.id] ? i : null)).filter((i) => i !== null);
        if (drawn.value <= 4 && unknownIdxs.length > 0) swapIdx = unknownIdxs[Math.floor(Math.random() * unknownIdxs.length)];
      }
      const nextTurn = "p1";
      let finalTurnTaken = s.finalTurnTaken;
      if (s.phase === "kabul-final") finalTurnTaken = true;
      const botTurns = (s.botTurns || 0) + 1;
      if (swapIdx !== -1) {
        const old = bot.grid[swapIdx];
        bot.grid[swapIdx] = drawn;
        const discardPile = [...s.discardPile, old];
        let next = {
          ...s, players, discardPile, drawnCard: null, drawnBy: null, turn: nextTurn, finalTurnTaken, botTurns, kabulWindow: null, firstDiscardDone: true,
          lastMove: {
            keys: [`${BOT_SLOT}-${swapIdx}`],
            flights: [
              { from: "drawn", to: `${BOT_SLOT}-${swapIdx}`, card: drawn, faceUp: false },
              { from: `${BOT_SLOT}-${swapIdx}`, to: "discard", card: old, faceUp: true },
            ],
            ts: Date.now(),
          },
          log: [...s.log, `${nameOf(s, BOT_SLOT)} swapped in a card.`],
        };
        if (s.phase === "kabul-final") next = finalizeRound(next);
        return next;
      }
      const discardPile = [...s.discardPile, drawn];
      // no powers on the final turn — the caller's hand is locked
      const pendingEffect = drawn.effect && s.phase !== "kabul-final" ? { effect: drawn.effect, by: BOT_SLOT } : null;
      let next = {
        ...s, discardPile, drawnCard: null, drawnBy: null, turn: nextTurn, pendingEffect, finalTurnTaken, botTurns, kabulWindow: null, firstDiscardDone: true,
        lastMove: { keys: [], flights: [{ from: "drawn", to: "discard", card: drawn, faceUp: true }], ts: Date.now() },
        log: [...s.log, `${nameOf(s, BOT_SLOT)} discarded the drawn card${pendingEffect ? " — using its power!" : "."}`],
      };
      if (!pendingEffect && s.phase === "kabul-final") next = finalizeRound(next);
      return next;
    });
  }

  async function botResolveEffect() {
    await updateRoom((s) => {
      if (!s.pendingEffect || s.pendingEffect.by !== BOT_SLOT) return s;
      const effect = s.pendingEffect.effect;
      const players = s.players.map((p) => ({ ...p, grid: [...p.grid] }));
      const bot = players.find((p) => p.slot === BOT_SLOT);
      const human = players.find((p) => p.slot !== BOT_SLOT);
      const known = { ...(s.botKnown || {}) };

      if (effect === "view-own" || effect === "view-opp") {
        const target = effect === "view-own" ? bot : human;
        const idxs = target.grid.map((c, i) => (c && !known[c.id] ? i : null)).filter((i) => i !== null);
        if (idxs.length) known[target.grid[idxs[Math.floor(Math.random() * idxs.length)]].id] = true;
        let next = {
          ...s, botKnown: known, pendingEffect: null,
          log: [...s.log, `${nameOf(s, BOT_SLOT)} peeked at one of ${effect === "view-own" ? "its own" : "your"} cards.`],
        };
        if (next.finalTurnTaken) next = finalizeRound(next);
        return next;
      }

      if (effect === "view1-swap" || effect === "view2-swap") {
        const viewCount = effect === "view1-swap" ? 1 : 2;
        const idxs = human.grid.map((c, i) => (c ? i : null)).filter((i) => i !== null).sort(() => Math.random() - 0.5).slice(0, viewCount);
        idxs.forEach((i) => { known[human.grid[i].id] = true; });
      }

      // shared swap decision for blind-swap, view1-swap, view2-swap
      let worstOwnIdx = -1, worstOwnVal = -Infinity;
      bot.grid.forEach((c, i) => { if (c && known[c.id] && c.value > worstOwnVal) { worstOwnVal = c.value; worstOwnIdx = i; } });
      if (worstOwnIdx === -1) {
        const any = bot.grid.map((c, i) => (c ? i : null)).filter((i) => i !== null);
        if (any.length) worstOwnIdx = any[Math.floor(Math.random() * any.length)];
      }
      let bestOppIdx = -1, bestOppVal = Infinity;
      human.grid.forEach((c, i) => { if (c && known[c.id] && c.value < bestOppVal) { bestOppVal = c.value; bestOppIdx = i; } });
      if (bestOppIdx === -1) {
        const any = human.grid.map((c, i) => (c ? i : null)).filter((i) => i !== null);
        if (any.length) bestOppIdx = any[Math.floor(Math.random() * any.length)];
      }
      let next = { ...s, botKnown: known, pendingEffect: null };
      if (worstOwnIdx !== -1 && bestOppIdx !== -1) {
        const tmp = bot.grid[worstOwnIdx];
        const humanCard = human.grid[bestOppIdx];
        bot.grid[worstOwnIdx] = humanCard;
        human.grid[bestOppIdx] = tmp;
        next.players = players;
        next.lastMove = {
          keys: [`${BOT_SLOT}-${worstOwnIdx}`, `${human.slot}-${bestOppIdx}`],
          flights: [
            { from: `${BOT_SLOT}-${worstOwnIdx}`, to: `${human.slot}-${bestOppIdx}`, card: tmp, faceUp: false },
            { from: `${human.slot}-${bestOppIdx}`, to: `${BOT_SLOT}-${worstOwnIdx}`, card: humanCard, faceUp: false },
          ],
          ts: Date.now(),
        };
        next.log = [...s.log, `${nameOf(s, BOT_SLOT)} swapped a card with you.`];
      } else {
        next.log = [...s.log, `${nameOf(s, BOT_SLOT)} had no card to swap.`];
      }
      if (next.finalTurnTaken) next = finalizeRound(next);
      return next;
    });
  }

  async function botGiveCard() {
    await updateRoom((s) => {
      if (!s.pendingGive || s.pendingGive.from !== BOT_SLOT) return s;
      const players = s.players.map((p) => ({ ...p, grid: [...p.grid] }));
      const bot = players.find((p) => p.slot === BOT_SLOT);
      const human = players.find((p) => p.slot === s.pendingGive.to);
      const known = s.botKnown || {};
      let idx = -1, val = -Infinity;
      bot.grid.forEach((c, i) => { if (c && known[c.id] && c.value > val) { val = c.value; idx = i; } });
      if (idx === -1) {
        const any = bot.grid.map((c, i) => (c ? i : null)).filter((i) => i !== null);
        if (any.length) idx = any[Math.floor(Math.random() * any.length)];
      }
      if (idx === -1) return { ...s, pendingGive: null };
      const card = bot.grid[idx];
      bot.grid[idx] = null;
      const empty = human.grid.findIndex((c) => c === null);
      let landIdx;
      if (empty !== -1) { human.grid[empty] = card; landIdx = empty; } else { human.grid.push(card); landIdx = human.grid.length - 1; }
      return {
        ...s, players, pendingGive: null,
        lastMove: {
          keys: [`${human.slot}-${landIdx}`],
          flights: [{ from: `${BOT_SLOT}-${idx}`, to: `${human.slot}-${landIdx}`, card, faceUp: false }],
          ts: Date.now(),
        },
        log: [...s.log, `${nameOf(s, BOT_SLOT)} handed you a card.`],
      };
    });
  }

  async function botMaybeStack() {
    await updateRoom((s) => {
      if (s.phase !== "playing" || s.pendingGive || !s.firstDiscardDone) return s;
      const top = s.discardPile[s.discardPile.length - 1];
      if (!top) return s;
      const known = s.botKnown || {};
      const players = s.players.map((p) => ({ ...p, grid: [...p.grid] }));
      const bot = players.find((p) => p.slot === BOT_SLOT);
      const human = players.find((p) => p.slot !== BOT_SLOT);
      const ownIdx = bot.grid.findIndex((c) => c && known[c.id] && c.rank === top.rank);
      const oppIdx = human.grid.findIndex((c) => c && known[c.id] && c.rank === top.rank);
      if (ownIdx === -1 && oppIdx === -1) return s;
      if (ownIdx !== -1) {
        const card = bot.grid[ownIdx];
        bot.grid[ownIdx] = null;
        return {
          ...s, players, discardPile: [...s.discardPile, card],
          lastMove: { keys: [], flights: [{ from: `${BOT_SLOT}-${ownIdx}`, to: "discard", card, faceUp: true }], ts: Date.now() },
          log: [...s.log, `${nameOf(s, BOT_SLOT)} stacked a ${card.rank}${SUIT_SYMBOL[card.suit]} from its own cards.`],
        };
      }
      const card = human.grid[oppIdx];
      human.grid[oppIdx] = null;
      return {
        ...s, players, discardPile: [...s.discardPile, card], pendingGive: { from: BOT_SLOT, to: "p1" },
        lastMove: { keys: [], flights: [{ from: `${human.slot}-${oppIdx}`, to: "discard", card, faceUp: true }], ts: Date.now() },
        log: [...s.log, `${nameOf(s, BOT_SLOT)} stacked a ${card.rank}${SUIT_SYMBOL[card.suit]} from your cards!`],
      };
    });
  }

  useEffect(() => {
    if (mode !== "bot" || !room) return;
    const bot = room.players.find((p) => p.slot === BOT_SLOT);
    if (room.phase === "peek" && bot && !bot.ready) {
      const t = setTimeout(botReady, 500);
      return () => clearTimeout(t);
    }
  }, [mode, botSig]);

  useEffect(() => {
    if (mode !== "bot" || !room) return;
    if (room.turn !== BOT_SLOT || room.drawnCard || room.pendingEffect || room.pendingGive) return;
    if (room.phase !== "playing" && room.phase !== "kabul-final") return;
    // hold off until the player's post-move Kabul window has expired
    const windowLeft = room.kabulWindow ? room.kabulWindow.expires - Date.now() : 0;
    const delay = Math.max(1100 + Math.random() * 700, windowLeft + 250);
    const t = setTimeout(() => {
      const bot = room.players.find((p) => p.slot === BOT_SLOT);
      const known = room.botKnown || {};
      const estimate = bot.grid.reduce((sum, c) => sum + (c ? (known[c.id] ? c.value : 5) : 0), 0);
      if (room.phase === "playing" && !room.kabulCalledBy && (room.botTurns || 0) >= 2 && estimate <= 5) botCallKabul();
      else botDraw();
    }, delay);
    return () => clearTimeout(t);
  }, [mode, botSig]);

  useEffect(() => {
    if (mode !== "bot" || !room) return;
    if (room.drawnBy !== BOT_SLOT || !room.drawnCard) return;
    const t = setTimeout(botDecideDrawn, 900 + Math.random() * 600);
    return () => clearTimeout(t);
  }, [mode, botSig]);

  useEffect(() => {
    if (mode !== "bot" || !room) return;
    if (!room.pendingEffect || room.pendingEffect.by !== BOT_SLOT) return;
    const t = setTimeout(botResolveEffect, 900 + Math.random() * 700);
    return () => clearTimeout(t);
  }, [mode, botSig]);

  useEffect(() => {
    if (mode !== "bot" || !room) return;
    if (!room.pendingGive || room.pendingGive.from !== BOT_SLOT) return;
    const t = setTimeout(botGiveCard, 800 + Math.random() * 500);
    return () => clearTimeout(t);
  }, [mode, botSig]);

  useEffect(() => {
    if (mode !== "bot" || !room) return;
    if (room.phase !== "playing" || room.drawnCard || room.pendingGive || !room.discardPile.length) return;
    const topId = room.discardPile[room.discardPile.length - 1].id;
    if (botStackSeenRef.current === topId) return;
    const t = setTimeout(() => { botStackSeenRef.current = topId; botMaybeStack(); }, 700 + Math.random() * 600);
    return () => clearTimeout(t);
  }, [mode, botSig]);

  /* ---------------- board tap dispatch ---------------- */
  function handleEffectFlowTap(targetSlot, card) {
    setEffectFlow((flow) => {
      if (!flow) return flow;
      const isOwn = targetSlot === mySlot;
      switch (flow.type) {
        case "view-own":
          if (flow.stage === "pick" && isOwn) {
            setModal({ cards: [card] });
            return { ...flow, stage: "done" };
          }
          return flow;
        case "view-opp":
          if (flow.stage === "pick" && !isOwn) {
            setModal({ cards: [card] });
            return { ...flow, stage: "done" };
          }
          return flow;
        case "blind-swap":
          if (flow.stage === "pick-own" && isOwn) return { ...flow, stage: "pick-opp", ownId: card.id };
          if (flow.stage === "pick-opp" && !isOwn) { resolveSwapEffect(flow.ownId, card.id); return null; }
          return flow;
        case "view1-swap":
          if (flow.stage === "pick-view" && !isOwn) {
            setModal({ cards: [card], continueFlow: true });
            return { ...flow, stage: "pick-own" };
          }
          if (flow.stage === "pick-own" && isOwn) return { ...flow, stage: "pick-opp", ownId: card.id };
          if (flow.stage === "pick-opp" && !isOwn) { resolveSwapEffect(flow.ownId, card.id); return null; }
          return flow;
        case "view2-swap":
          if (flow.stage === "pick-view" && !isOwn) {
            const viewed = [...(flow.viewed || []), card];
            if (viewed.length < 2) return { ...flow, viewed };
            setModal({ cards: viewed, continueFlow: true });
            return { ...flow, stage: "pick-own", viewed };
          }
          if (flow.stage === "pick-own" && isOwn) return { ...flow, stage: "pick-opp", ownId: card.id };
          if (flow.stage === "pick-opp" && !isOwn) { resolveSwapEffect(flow.ownId, card.id); return null; }
          return flow;
        default:
          return flow;
      }
    });
  }

  // briefly mark a tapped card so the player can see what they just picked
  function markTapped(key) {
    setTapSelected(key);
    clearTimeout(tapTimerRef.current);
    tapTimerRef.current = setTimeout(() => setTapSelected(null), 650);
  }

  // God mode: pull a card straight off either grid. Used to undo mistakes,
  // most often a penalty card picked up because stack mode was left on.
  async function handleGodRemove(targetSlot, cardId) {
    await updateRoom((s) => {
      const players = s.players.map((p) => ({ ...p, grid: [...p.grid] }));
      const target = players.find((p) => p.slot === targetSlot);
      const i = target.grid.findIndex((c) => c && c.id === cardId);
      if (i === -1) return s;
      const card = target.grid[i];
      target.grid[i] = null;
      return {
        ...s, players,
        log: [...s.log, `God mode: removed ${card.rank}${SUIT_SYMBOL[card.suit]} from ${nameOf(s, targetSlot)}'s cards.`],
      };
    });
  }

  function handleGridTap(targetSlot, card, idx) {
    if (!card) return;
    const key = `${targetSlot}-${idx}`;
    if (godMode) {
      markTapped(key);
      handleGodRemove(targetSlot, card.id);
      return;
    }
    if (stackMode) {
      if (!room.pendingGive && room.phase === "playing") {
        markTapped(key);
        handleStackTap(targetSlot, card.id);
      }
      return;
    }
    if (room.drawnCard && room.drawnBy === mySlot && targetSlot === mySlot && !effectFlow) {
      markTapped(key);
      handleSwapDrawn(card.id);
      return;
    }
    if (effectFlow) { markTapped(key); handleEffectFlowTap(targetSlot, card); return; }
  }

  function closeModal() {
    const wasEffectDone = modal && !modal.continueFlow;
    setModal(null);
    if (wasEffectDone) resolveViewEffect();
  }

  /* ================================================================ */
  /* Render: home screen                                                */
  /* ================================================================ */
  if (screen === "home") {
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={roomStyle}>
      <AnimStyles />
        <div className="w-full max-w-sm">
          <div className="text-center mb-8">
            <h1 className="font-serif text-5xl font-bold" style={{ color: C.goldSoft, letterSpacing: "0.04em", textShadow: "0 2px 18px rgba(226,178,120,0.25)" }}>Kabul</h1>
            <p className="mt-2 text-sm" style={{ color: C.muted }}>A two-player memory &amp; bluffing card game</p>
          </div>

          <div className="rounded-2xl p-5 mb-4" style={{ background: `${WEAVE}, linear-gradient(180deg, rgba(42,27,17,0.46), rgba(42,27,17,0.34))`, border: "1px solid rgba(255,225,190,0.14)", boxShadow: "0 8px 24px rgba(40,24,12,0.32)" }}>
            <label className="block text-xs mb-1.5" style={{ color: C.muted }}>Your name</label>
            <input
              value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Sam" maxLength={16}
              className="w-full rounded-lg px-3 py-2.5 mb-4 outline-none"
              style={{ background: "#efe5d5", color: C.ink, border: "1px solid rgba(192,138,78,0.25)" }}
            />
            <button onClick={handleCreate} disabled={busy} className="w-full py-3 rounded-xl font-semibold mb-3" style={{ background: `linear-gradient(180deg, #d09a5e, ${C.gold})`, color: "#2a1f18", boxShadow: "0 4px 14px rgba(192,138,78,0.25)" }}>
              Create a room
            </button>

            <div className="flex items-center gap-2 my-3">
              <div className="h-px flex-1" style={{ background: "rgba(192,138,78,0.22)" }} />
              <span className="text-xs" style={{ color: C.muted }}>or join a friend</span>
              <div className="h-px flex-1" style={{ background: "rgba(192,138,78,0.22)" }} />
            </div>

            <input
              value={joinCode} onChange={(e) => setJoinCode(e.target.value.toUpperCase())} placeholder="ROOM CODE" maxLength={4}
              className="w-full rounded-lg px-3 py-2.5 mb-3 outline-none tracking-widest text-center font-serif text-lg"
              style={{ background: "#efe5d5", color: C.ink, border: "1px solid rgba(192,138,78,0.25)" }}
            />
            <button onClick={handleJoin} disabled={busy} className="w-full py-3 rounded-lg font-semibold" style={{ background: "transparent", color: C.goldSoft, border: `1px solid ${C.gold}` }}>
              Join room
            </button>
            {error && <p className="text-sm mt-3" style={{ color: "#d99a85" }}>{error}</p>}
          </div>

          <button onClick={handlePlayBot} className="w-full py-3 rounded-lg font-semibold mb-4" style={{ background: "transparent", color: C.muted, border: "1px solid rgba(255,225,190,0.3)" }}>
            Practice against a bot
          </button>

          <button onClick={() => setShowRules(true)} className="w-full text-center text-xs underline" style={{ color: C.muted }}>
            How to play
          </button>
        </div>
        {showRules && <RulesModal onClose={() => setShowRules(false)} />}
      </div>
    );
  }

  /* ================================================================ */
  /* Render: connecting                                                 */
  /* ================================================================ */
  if (!room) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: C.feltDeep, color: C.muted }}>
        Connecting…
      </div>
    );
  }

  const me = room.players.find((p) => p.slot === mySlot);
  const opp = room.players.find((p) => p.slot !== mySlot);

  /* ================================================================ */
  /* Render: lobby                                                      */
  /* ================================================================ */
  if (room.phase === "lobby") {
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={roomStyle}>
      <AnimStyles />
        <div className="w-full max-w-sm text-center">
          <h2 className="font-serif text-2xl font-bold mb-1" style={{ color: C.goldSoft }}>Room ready</h2>
          <p className="text-sm mb-6" style={{ color: C.muted }}>Tell your friend to join with this code:</p>
          <button onClick={copyCode} className="mx-auto mb-6 flex items-center gap-2 px-6 py-3 rounded-xl font-serif text-3xl tracking-widest" style={{ background: C.card, color: C.ink }}>
            {code} {copied ? <Check size={20} /> : <Copy size={18} />}
          </button>
          <div className="flex items-center justify-center gap-2 mb-2" style={{ color: opp.connected ? "#a8bf92" : C.muted }}>
            <Users size={16} />
            <span className="text-sm">{opp.connected ? `${opp.name} has joined!` : "Waiting for a second player…"}</span>
          </div>
          {mySlot === "p1" && (
            <button onClick={handleStartRound} disabled={!opp.connected} className="w-full mt-6 py-3 rounded-lg font-semibold disabled:opacity-40" style={{ background: C.gold, color: C.feltDeep }}>
              Deal the cards
            </button>
          )}
          {mySlot === "p2" && !opp.connected && (
            <p className="text-xs mt-4" style={{ color: C.muted }}>Waiting for the host to start the round.</p>
          )}
          <button onClick={leaveRoom} className="mt-8 text-xs underline flex items-center gap-1 mx-auto" style={{ color: C.muted }}>
            <LogOut size={12} /> Leave
          </button>
        </div>
      </div>
    );
  }

  /* ================================================================ */
  /* Render: peek phase                                                 */
  /* ================================================================ */
  if (room.phase === "peek") {
    const myReady = me.ready;
    return (
      <div className="min-h-screen flex flex-col items-center p-4" style={roomStyle}>
      <AnimStyles />
        <h2 className="font-serif text-xl font-bold mt-6 mb-1" style={{ color: C.goldSoft }}>Round {room.round} — Peek</h2>
        <p className="text-sm text-center mb-6 max-w-xs" style={{ color: C.muted }}>
          Tap your <strong>bottom two</strong> cards to look at them, then memorize them — you won't get another free look.
        </p>
        <div className="flex gap-3 justify-center mb-3">
          <PlayingCard card={me.grid[0]} faceUp={false} />
          <PlayingCard card={me.grid[1]} faceUp={false} />
        </div>
        <div className="flex gap-3 justify-center">
          <PlayingCard card={me.grid[2]} faceUp={peekedIdx.includes(2)} onClick={!myReady ? () => setPeekedIdx((p) => (p.includes(2) ? p : [...p, 2])) : undefined} highlight={!myReady && !peekedIdx.includes(2)} />
          <PlayingCard card={me.grid[3]} faceUp={peekedIdx.includes(3)} onClick={!myReady ? () => setPeekedIdx((p) => (p.includes(3) ? p : [...p, 3])) : undefined} highlight={!myReady && !peekedIdx.includes(3)} />
        </div>

        {!myReady ? (
          <button onClick={handlePeekReady} className="mt-10 px-8 py-3 rounded-xl font-semibold" style={{ background: `linear-gradient(180deg, #d09a5e, ${C.gold})`, color: "#2a1f18", boxShadow: "0 4px 14px rgba(192,138,78,0.25)" }}>
            I've got it — start
          </button>
        ) : (
          <p className="mt-10 text-sm" style={{ color: C.muted }}>Waiting for {opp.name || "your opponent"}…</p>
        )}

        {shuffling && <ShuffleOverlay onDone={() => setShuffling(false)} />}
      </div>
    );
  }

  /* ================================================================ */
  /* Render: round-end / game-end                                       */
  /* ================================================================ */
  if (room.phase === "round-end" || room.phase === "game-end") {
    const r = room.roundResult;
    const finalWinner = room.phase === "game-end"
      ? (room.players[0].score < room.players[1].score ? room.players[0] : room.players[1].score < room.players[0].score ? room.players[1] : null)
      : null;
    const roundCount = Math.max(...room.players.map((p) => p.roundScores.length), 0);
    return (
      <div className="min-h-screen flex flex-col items-center p-4" style={roomStyle}>
      <AnimStyles />
        <div className="w-full max-w-sm mt-6 pb-8">
          {room.phase === "game-end" ? (
            <div className="text-center mb-5">
              <Trophy size={40} className="mx-auto mb-2" style={{ color: C.gold }} />
              <h2 className="font-serif text-2xl font-bold" style={{ color: C.goldSoft }}>
                {finalWinner ? `${finalWinner.name} wins the match!` : "It's a tie!"}
              </h2>
            </div>
          ) : (
            <h2 className="font-serif text-2xl font-bold text-center mb-1" style={{ color: C.goldSoft }}>Round {room.round} results</h2>
          )}

          {r && (
            <div className="rounded-2xl p-4 mb-5" style={{ background: `${WEAVE}, linear-gradient(180deg, rgba(42,27,17,0.42), rgba(42,27,17,0.30))`, border: "1px solid rgba(255,225,190,0.12)", boxShadow: "0 6px 18px rgba(40,24,12,0.28)" }}>
              <p className="text-sm text-center mb-3" style={{ color: C.card }}>
                {nameOf(room, room.kabulCalledBy)} called Kabul and {r.callerHasLowest ? "had the lower hand." : "did NOT have the lower hand."}
              </p>
              <div className="text-xs space-y-1" style={{ color: C.muted, fontVariantNumeric: "tabular-nums" }}>
                {room.players.map((p) => {
                  const total = p.slot === "p1" ? r.t1 : r.t2;
                  const b = r.bonus[p.slot];
                  const rs = p.slot === "p1" ? r.roundScoreP1 : r.roundScoreP2;
                  return (
                    <div key={p.slot} className="flex justify-between">
                      <span>{p.slot === mySlot ? "You" : p.name}</span>
                      <span>
                        {total} cards {b === 0 ? "" : b > 0 ? `+ ${b} penalty ` : `− ${Math.abs(b)} bonus `}= {rs}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* the reveal — both hands face up */}
          <div className="rounded-2xl p-4 mb-5" style={{ background: `${WEAVE}, linear-gradient(180deg, rgba(42,27,17,0.42), rgba(42,27,17,0.30))`, border: "1px solid rgba(255,225,190,0.12)", boxShadow: "0 6px 18px rgba(40,24,12,0.28)" }}>
            <p className="text-xs mb-3 text-center" style={{ color: C.muted }}>The hands</p>
            {room.players.map((p, pi) => {
              const handTotal = gridTotal(p.grid);
              const bonus = r ? r.bonus[p.slot] : 0;
              return (
                <div key={p.slot} className="mb-3" style={{ paddingTop: pi === 1 ? "0.75rem" : 0, borderTop: pi === 1 ? "1px solid rgba(192,138,78,0.16)" : "none" }}>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-sm" style={{ color: C.card }}>
                      {p.name}{p.slot === mySlot ? " (you)" : ""}{p.slot === room.kabulCalledBy ? " 👑" : ""}
                    </span>
                    <span className="text-xs" style={{ color: C.muted, fontVariantNumeric: "tabular-nums" }}>
                      cards {handTotal}{bonus !== 0 ? ` ${bonus > 0 ? "+" : "−"}${Math.abs(bonus)} bonus` : ""}
                    </span>
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(2, max-content)", gap: "0.5rem", width: "fit-content", margin: "0 auto" }}>
                    {p.grid.map((c, i) => (
                      <div key={i} className="flex flex-col items-center">
                        <PlayingCard card={c} faceUp={!!c} size="sm" />
                        <span className="text-xs mt-1" style={{ color: C.muted, fontVariantNumeric: "tabular-nums" }}>{c ? c.value : "—"}</span>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>

          {/* round-by-round scoreboard */}
          <div className="rounded-2xl p-4 mb-5" style={{ background: `${WEAVE}, linear-gradient(180deg, rgba(42,27,17,0.42), rgba(42,27,17,0.30))`, border: "1px solid rgba(255,225,190,0.12)", boxShadow: "0 6px 18px rgba(40,24,12,0.28)" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontVariantNumeric: "tabular-nums" }}>
              <thead>
                <tr>
                  <th className="text-left text-xs font-normal pb-2" style={{ color: C.muted }}>Round</th>
                  {room.players.map((p) => (
                    <th key={p.slot} className="text-right text-xs font-normal pb-2" style={{ color: C.muted }}>
                      {p.slot === mySlot ? "You" : p.name}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {Array.from({ length: 5 }).map((_, i) => {
                  const played = i < roundCount;
                  return (
                    <tr key={i} style={{ borderTop: "1px solid rgba(192,138,78,0.12)" }}>
                      <td className="text-xs py-1.5" style={{ color: played ? C.card : "rgba(240,220,196,0.42)" }}>{i + 1}</td>
                      {room.players.map((p) => (
                        <td key={p.slot} className="text-right text-sm py-1.5" style={{ color: played ? C.card : "rgba(240,220,196,0.32)" }}>
                          {played ? p.roundScores[i] : "—"}
                        </td>
                      ))}
                    </tr>
                  );
                })}
                <tr style={{ borderTop: `2px solid ${C.gold}` }}>
                  <td className="text-xs py-2 font-semibold" style={{ color: C.goldSoft }}>Total</td>
                  {room.players.map((p) => {
                    const leading = room.players.every((o) => p.score <= o.score);
                    return (
                      <td key={p.slot} className="text-right py-2 font-serif text-lg font-bold" style={{ color: leading ? C.goldSoft : C.card }}>
                        {p.score}
                      </td>
                    );
                  })}
                </tr>
              </tbody>
            </table>
            <p className="text-xs mt-2 text-center" style={{ color: C.muted }}>Lowest score wins</p>
          </div>

          {room.phase === "round-end" ? (
            <button onClick={handleNextRound} className="w-full py-3 rounded-xl font-semibold" style={{ background: `linear-gradient(180deg, #d09a5e, ${C.gold})`, color: "#2a1f18", boxShadow: "0 4px 14px rgba(192,138,78,0.25)" }}>
              {room.round >= 5 ? "See final result" : `Start round ${room.round + 1}`}
            </button>
          ) : (
            <button onClick={handleNewMatch} className="w-full py-3 rounded-xl font-semibold" style={{ background: `linear-gradient(180deg, #d09a5e, ${C.gold})`, color: "#2a1f18", boxShadow: "0 4px 14px rgba(192,138,78,0.25)" }}>
              Play again
            </button>
          )}
          <button onClick={leaveRoom} className="mt-4 text-xs underline flex items-center gap-1 mx-auto" style={{ color: C.muted }}>
            <LogOut size={12} /> Leave
          </button>
        </div>
      </div>
    );
  }

  /* ================================================================ */
  /* Render: main board (playing / kabul-final)                         */
  /* ================================================================ */
  const kabulWindowOpen = !!(room.kabulWindow && nowTick < room.kabulWindow.expires);
  const myKabulWindow = kabulWindowOpen && room.kabulWindow.slot === mySlot;
  const kabulSecsLeft = kabulWindowOpen ? Math.ceil((room.kabulWindow.expires - nowTick) / 1000) : 0;

  const myTurn = room.turn === mySlot;
  const discardTop = room.discardPile[room.discardPile.length - 1];
  const iAmDeciding = room.drawnCard && room.drawnBy === mySlot;
  const oppDeciding = room.drawnCard && room.drawnBy !== mySlot;
  const iCanAct = myTurn && !room.drawnCard && !room.pendingEffect && !room.pendingGive && !kabulWindowOpen;
  const canStack = room.phase === "playing" && !room.pendingGive;
  const canKabul = room.phase === "playing" && !room.kabulCalledBy && !room.drawnCard && !room.pendingEffect
    && (myKabulWindow || (myTurn && !room.pendingGive && !kabulWindowOpen));
  const myEffectActive = room.pendingEffect && room.pendingEffect.by === mySlot;

  // which cards should read as "selected": the one just tapped, plus — during a
  // swap power-up — the card you already locked in while you choose its partner
  const selectedKeys = new Set();
  if (tapSelected) selectedKeys.add(tapSelected);
  if (effectFlow && effectFlow.ownId) {
    const i = me.grid.findIndex((c) => c && c.id === effectFlow.ownId);
    if (i !== -1) selectedKeys.add(`${mySlot}-${i}`);
  }
  if (effectFlow && effectFlow.viewed && effectFlow.viewed.length) {
    effectFlow.viewed.forEach((vc) => {
      const i = opp.grid.findIndex((c) => c && c.id === vc.id);
      if (i !== -1) selectedKeys.add(`${opp.slot}-${i}`);
    });
  }
  const oppEffectActive = room.pendingEffect && room.pendingEffect.by !== mySlot;
  const myGiveActive = room.pendingGive && room.pendingGive.from === mySlot && me.grid.some(Boolean);

  return (
    <div className="min-h-screen flex flex-col" style={roomStyle}>
      <AnimStyles />
      {/* header */}
      <div className="flex items-center justify-between px-4 py-2 text-xs" style={{ color: C.muted }}>
        <span>Round {room.round}/5</span>
        <button onClick={() => setShowRules(true)} className="flex items-center gap-1"><Info size={13} /> Rules</button>
        <span style={{ fontVariantNumeric: "tabular-nums" }}>You {me.score} · {opp.name} {opp.score}</span>
      </div>

      {/* opponent */}
      <div className="flex flex-col items-center py-2">
        <div className="text-sm mb-2 flex items-center gap-2" style={{ color: room.turn === opp.slot ? C.goldSoft : C.muted }}>
          {opp.name || "Opponent"} {room.kabulCalledBy === opp.slot && "· KABUL"} {room.turn === opp.slot && !room.kabulCalledBy && "· their turn"}
        </div>
        <CardGridStack cards={opp.grid} faceUp={false} size="sm" onTap={(c, i) => handleGridTap(opp.slot, c, i)} slot={opp.slot} flashSet={flashKeys} selectedSet={selectedKeys} anchorFor={anchorFor} />
      </div>

      {/* middle: piles */}
      <div className="flex-1 flex flex-col items-center justify-center gap-4 py-4">
        {oppDeciding && <p className="text-xs" style={{ color: C.muted }}>{opp.name} is deciding…</p>}
        {oppEffectActive && <p className="text-xs" style={{ color: C.muted }}>{opp.name} is using the {room.pendingEffect.effect ? "card's" : ""} power…</p>}
        {myGiveActive && <p className="text-xs font-semibold" style={{ color: C.goldSoft }}>Choose a card below to hand over</p>}
        {myEffectActive && !stackMode && <p className="text-xs font-semibold text-center px-6" style={{ color: C.goldSoft }}>{effectPrompt(effectFlow)}</p>}
        {myEffectActive && stackMode && <p className="text-xs font-semibold text-center px-6" style={{ color: C.goldSoft }}>Stacking — turn Stack off to pick up your power-up where you left off.</p>}

        <div className="flex items-center gap-6">
          <div className="flex flex-col items-center gap-1">
            <PlayingCard card={room.drawPile[0] ? { id: "back" } : null} faceUp={false} onClick={iCanAct ? () => handleDrawFrom("deck") : undefined} anchor={anchorFor("deck")} />
            <span className="text-xs" style={{ color: C.muted }}>{room.drawPile.length} left</span>
          </div>
          <div className="flex flex-col items-center gap-1">
            <PlayingCard card={discardTop} faceUp={true} onClick={iCanAct && discardTop ? () => handleDrawFrom("discard") : undefined} anchor={anchorFor("discard")} />
            <span className="text-xs" style={{ color: C.muted }}>discard</span>
          </div>
          {room.drawnCard && (
            <div className="flex flex-col items-center gap-1">
              <PlayingCard card={room.drawnCard} faceUp={room.drawnBy === mySlot} highlight anchor={anchorFor("drawn")} />
              <span className="text-xs" style={{ color: C.muted }}>drawn</span>
            </div>
          )}
        </div>

        {iAmDeciding && (
          <div className="flex flex-col items-center gap-2 mt-1">
            <p className="text-xs text-center max-w-xs" style={{ color: C.goldSoft }}>Tap a card below to swap it in, or discard what you drew.</p>
            <button onClick={handleDiscardDrawn} className="px-5 py-2 rounded-lg text-sm font-semibold" style={{ background: "transparent", border: `1px solid ${C.gold}`, color: C.goldSoft }}>
              Discard drawn card
            </button>
          </div>
        )}

        {myKabulWindow && (
          <p className="text-xs font-semibold text-center px-6" style={{ color: C.goldSoft }}>
            Last chance to call Kabul — {kabulSecsLeft}s
          </p>
        )}
        {kabulWindowOpen && !myKabulWindow && (
          <p className="text-xs text-center px-6" style={{ color: C.muted }}>
            {opp.name} still has a moment to call Kabul…
          </p>
        )}

        {myTurn && room.phase === "playing" && !room.drawnCard && !room.kabulCalledBy && !room.pendingEffect && (
          <p className="text-xs" style={{ color: C.goldSoft }}>Your turn — draw from the deck or discard pile.</p>
        )}
        {room.phase === "kabul-final" && myTurn && (
          <p className="text-xs font-semibold" style={{ color: "#d99a85" }}>Final turn! Kabul was called.</p>
        )}
      </div>

      {/* my grid */}
      <div className="flex flex-col items-center pb-3">
        <div style={{ marginBottom: "0.5rem" }}>
          <CardGridStack cards={me.grid} faceUp={false} onTap={(c, i) => handleGridTap(mySlot, c, i)} slot={mySlot} flashSet={flashKeys} selectedSet={selectedKeys} anchorFor={anchorFor} />
        </div>
        <div className="text-sm" style={{ color: myTurn ? C.goldSoft : C.muted }}>
          You {room.kabulCalledBy === mySlot && "· KABUL called"} {myTurn && !room.kabulCalledBy && room.phase === "playing" && "· your turn"}
        </div>
      </div>

      {/* action bar */}
      <div className="flex items-center justify-center gap-3 px-4 py-3" style={{ background: "linear-gradient(180deg, rgba(26,18,14,0.35), rgba(26,18,14,0.6))", borderTop: "1px solid rgba(192,138,78,0.12)" }}>
        <button
          onClick={() => setStackMode((v) => !v)}
          disabled={!canStack || godMode}
          className="flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-sm font-semibold disabled:opacity-25"
          style={{ background: stackMode ? C.gold : "transparent", color: stackMode ? C.feltDeep : C.goldSoft, border: `1px solid ${C.gold}` }}
        >
          <Layers size={15} /> {stackMode ? "Stack: ON" : "Stack: off"}
        </button>
        <button
          onClick={handleCallKabul}
          disabled={!canKabul}
          className="px-5 py-2.5 rounded-xl text-sm font-bold disabled:opacity-25"
          style={{ background: `linear-gradient(180deg, #ad5f50, ${C.danger})`, color: "#fdf3ec", boxShadow: "0 4px 12px rgba(158,83,70,0.3)" }}
        >
          {myKabulWindow ? `Call Kabul (${kabulSecsLeft})` : "Call Kabul"}
        </button>
      </div>

      {stackMode && !godMode && (
        <p className="text-center text-xs pb-2" style={{ background: "rgba(26,18,14,0.55)", color: C.goldSoft }}>
          {room.firstDiscardDone
            ? "Stack mode is on. Tap any card — yours or theirs — that matches the discard's rank. Stays on until you turn it off."
            : "Careful — the round hasn't been played yet. Stacking the opening card costs you a penalty."}
        </p>
      )}

      {godMode && (
        <p className="text-center text-xs pb-2" style={{ background: "rgba(62,34,84,0.75)", color: C.goldSoft }}>
          God mode — tap any card on either side to remove it. Turn off when you're done.
        </p>
      )}

      {/* God mode: a fix-it switch, parked out of the way on the right edge */}
      <button
        onClick={() => { setGodMode((v) => !v); setStackMode(false); }}
        className="fixed font-semibold"
        style={{
          right: 0, top: "50%", transform: "translateY(-50%)",
          zIndex: 40,
          background: godMode
            ? "linear-gradient(180deg, #7c4ea8, #5e3782)"
            : "linear-gradient(180deg, #5e3782, #45275f)",
          color: C.goldSoft,
          border: `1px solid ${godMode ? C.goldSoft : "rgba(232,196,143,0.35)"}`,
          borderRight: "none",
          borderTopLeftRadius: "0.75rem",
          borderBottomLeftRadius: "0.75rem",
          padding: "0.6rem 0.55rem",
          fontSize: "0.68rem",
          letterSpacing: "0.08em",
          writingMode: "vertical-rl",
          boxShadow: godMode
            ? "0 0 16px 3px rgba(124,78,168,0.55)"
            : "0 4px 12px rgba(20,12,8,0.4)",
        }}
      >
        GOD MODE
      </button>

      {/* activity log */}
      <details className="px-4 pb-4" style={{ color: C.muted }}>
        <summary className="text-xs cursor-pointer">Activity log</summary>
        <div className="text-xs mt-2 space-y-1 max-h-28 overflow-y-auto">
          {room.log.slice(-8).map((l, i) => <div key={i}>{l}</div>)}
        </div>
      </details>

      {/* modals */}
      {modal && (
        <Modal title="Card revealed" onClose={closeModal} closeLabel={modal.continueFlow ? "Continue" : "Got it"}>
          <div className="flex gap-3 justify-center">
            {modal.cards.map((c, i) => <RevealCard key={i} card={c} delay={i * 160} />)}
          </div>
        </Modal>
      )}

      {myGiveActive && (
        <Modal title="Hand over a card" z={80}>
          <p className="text-sm mb-3" style={{ color: C.ink }}>You stacked a card from {nameOf(room, room.pendingGive.to)}'s hand! Choose one of your own cards to hand over to them.</p>
          <CardGridStack cards={me.grid} faceUp={false} onTap={(c) => handleGiveCard(c.id)} />
        </Modal>
      )}

      {showRules && <RulesModal onClose={() => setShowRules(false)} />}

      {flights.map((f) => (
        <Flight key={f.id} flight={f} onDone={() => setFlights((prev) => prev.filter((x) => x.id !== f.id))} />
      ))}
    </div>
  );
}

/* ---------------------------------------------------------------- */
function RulesModal({ onClose }) {
  return (
    <Modal title="How to play Kabul" onClose={onClose}>
      <div className="text-sm space-y-2 max-h-96 overflow-y-auto" style={{ color: C.ink }}>
        <p>Each player gets 4 face-down cards. Peek at your bottom two once, then remember them — lower total value wins.</p>
        <p>On your turn, draw from the deck or the discard pile. Either swap it into your grid (the old card is discarded, no power) or discard it directly — if it has a power, you get to use it. Any 7 or 8 peeks at one of your own cards; any 9 or 10 peeks at one of theirs. The black J, Q and K add swaps on top.</p>
        <p>Anytime, either player can "Stack" a card of matching rank from any grid onto the discard pile — yours to shed a card, or an opponent's to remove one of theirs (you then hand them a card of your own choosing as a replacement). Guess wrong and you pick up a penalty card. You also can't stack off the card flipped at the start of a round: the first play must be a real turn, and stacking before that is an automatic penalty card.</p>
        <p>Call "Kabul" on your turn instead of drawing. Your hand locks, your opponent gets one last turn, then everyone reveals. If you had the lowest hand: −10. If not: you +5, they −5. Ties break on lowest individual card. Powers and stacking are both switched off during that final turn, so nobody can touch the locked hand.</p>
        <p>Lowest total score after 5 rounds wins the match.</p>
        <p className="text-xs italic pt-1" style={{ color: "#8a7461" }}>House rules added where the original notes were silent: wrong stack guesses draw a penalty card, and Kabul fully locks stacking for the rest of the round.</p>
      </div>
    </Modal>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<KabulGame />);

</script>
</body>
</html>
